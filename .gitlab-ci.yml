include:
  - component: $CI_SERVER_FQDN/my-projects/ci/ci-components/security@v1.17
    inputs:
      stage: test
      tags: [prod-docker]
  - component: $CI_SERVER_FQDN/my-projects/ci/ci-components/ci-hygiene@v1.17
    inputs:
      stage: lint
      tags: [prod-docker]
  # hadolint по Dockerfile и shellcheck по всем *.sh. Своя lint:shell убрана:
  # компонентная делает то же самое шире (весь репозиторий, а не .ci/*.sh),
  # а одноимённая локальная джоба не заменяет пришедшую из компонента, а
  # сливается с ней — получился бы гибрид из чужих rules и своего script.
  - component: $CI_SERVER_FQDN/my-projects/ci/ci-components/lint@v1.17
    inputs:
      stage: lint
      tags: [prod-docker]

  # Дополняет свой Trivy-гейт, а не заменяет: гейт падает на CRITICAL до
  # публикации, а этот кладёт находки в Vulnerability Report, где у них
  # есть история, dismiss с причиной и vulnerability-allowlist.yml.
  - component: $CI_SERVER_FQDN/my-projects/ci/ci-components/container-scanning@v1.17
    inputs:
      stage: scan
      repositories: [bedolaga-cabinet]
      needs_job: build_scan_publish
  # Собирает образ в merge request и НЕ публикует: штатная сборка ограничена
  # default-веткой, поэтому Dockerfile до сих пор проверялся только после
  # мёрджа. Базы (node:20-alpine, nginx:alpine) публичные — кредов не нужно.
  - component: $CI_SERVER_FQDN/my-projects/ci/ci-components/build-mr@v1.17
    inputs:
      stage: test
      dockerfiles: [Dockerfile]
  # Доказывает, что в проде именно этот коммит: ревизия запекается в образ
  # (ARG GIT_SHA) и отдаётся статикой по /version.json. Слово Coolify об
  # успешном деплое этого не доказывает — трижды оказывалось неверным.
  - component: $CI_SERVER_FQDN/my-projects/ci/ci-components/verify-deploy@v1.17
    inputs:
      stage: deploy
      tags: [prod-docker]
      revision_url: https://b1.iamem.store/version.json

stages:
  - lint
  - test
  - release
  - scan
  - deploy

default:
  tags:
    - prod-build
  interruptible: true
  timeout: 1h

variables:
  GIT_DEPTH: "1"
  TRIVY_CACHE_DIR: "/var/lib/gitlab-runner/cache/trivy"
  IMAGE_REPOSITORY: "bedolaga-cabinet"
  CACHE_REPOSITORY: "bedolaga-cabinet-buildcache"
  # Не секрет: без токена из Vault бесполезен. Здесь, а не в Vault, потому что
  # у каждого приложения он свой, а путь с токеном — общий на весь CI.
  COOLIFY_SERVICE_UUID: "i6apwzkyri2qtjd5ao0b06tu"
  # Build-time ARG без дефолта в апстримном Dockerfile. Публичный
  # ghcr.io-образ собран с пустым значением, из-за чего deep-link авторизация
  # через Telegram не работает — поэтому свой образ, а не чужой.
  VITE_TELEGRAM_BOT_USERNAME: "vpn_edde_bot"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # MR-пайплайн: без него approval policy не видит отчётов сканеров и
    # блокирует мёрдж как security_policy_violations — при этом «упавший»
    # пайплайн MR не содержит ни одной джобы, что уводит диагностику не туда.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Ветка, у которой уже открыт MR, своего пайплайна не получает: иначе
    # на каждый коммит их будет два.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Ветки тоже проверяются: без этого правила анализаторы безопасности
    # увидели бы код только после мёрджа, когда чинить поздно.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

lint:dockerfile-arg:
  stage: lint
  tags:
    - prod-docker
  # entrypoint: [""] обязателен — у alpine/git ENTRYPOINT это сам `git`,
  # и раннер выполняет `git sh -c …` → «'sh' is not a git command».
  image:
    name: alpine/git:2.47.1
    entrypoint: [""]
  script:
    # Апстрим обязан продолжать принимать этот ARG: без него образ соберётся
    # молча, но с пустым botname и сломанным deep-link.
    - grep -q 'ARG VITE_TELEGRAM_BOT_USERNAME' Dockerfile


# Тесты были написаны (14 файлов, 100 проверок) и vitest объявлен, а джобы не
# было вовсе — они не запускались ни разу. Локальный прогон перед заводкой:
# 14 файлов, 100 тестов, покрытие 91.32%.
test:
  stage: test
  tags: [prod-docker]
  image: docker-proxy-nexus.lab.oh-my-devops.space/library/node:20-alpine
  script:
    - npm ci
    # Провайдер v8, а не istanbul: он идёт от самого vitest и не требует
    # инструментирования сборки.
    - npx vitest run --coverage --coverage.reporter=text --coverage.reporter=cobertura
  coverage: '/^All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build_scan_publish:
  stage: release
  resource_group: bedolaga-cabinet-release
  # Только default-ветка: Vault-роль требует ref_protected: true.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.oh-my-devops.space
  variables:
    VAULT_SERVER_URL: https://vault.lab.oh-my-devops.space
    VAULT_AUTH_PATH: gitlab-jwt
    VAULT_AUTH_ROLE: github-mirror-build
  # GitLab сам меняет OIDC-токен на Vault-токен и маскирует значения в логах.
  # file: false обязателен — иначе в переменной путь к файлу, а не значение.
  secrets:
    NEXUS_USERNAME:
      vault:
        engine: {name: kv-v2, path: secret}
        path: infra/ci/github-mirror/nexus
        field: username
      token: $VAULT_ID_TOKEN
      file: false
    NEXUS_PASSWORD:
      vault:
        engine: {name: kv-v2, path: secret}
        path: infra/ci/github-mirror/nexus
        field: password
      token: $VAULT_ID_TOKEN
      file: false
    NEXUS_PROD_REGISTRY:
      vault:
        engine: {name: kv-v2, path: secret}
        path: infra/ci/github-mirror/nexus
        field: prod_registry
      token: $VAULT_ID_TOKEN
      file: false
    NEXUS_STAGING_REGISTRY:
      vault:
        engine: {name: kv-v2, path: secret}
        path: infra/ci/github-mirror/nexus
        field: staging_registry
      token: $VAULT_ID_TOKEN
      file: false
    NEXUS_CACHE_REGISTRY:
      vault:
        engine: {name: kv-v2, path: secret}
        path: infra/ci/github-mirror/nexus
        field: cache_registry
      token: $VAULT_ID_TOKEN
      file: false
  script:
    - |
      set -euo pipefail

      # config.json для rootless BuildKit: docker login тут неоткуда взять.
      export DOCKER_CONFIG="${CI_PROJECT_DIR}/.docker"
      install -d -m 0700 "$DOCKER_CONFIG"
      umask 077
      jq -n --arg auth "$(printf '%s:%s' "$NEXUS_USERNAME" "$NEXUS_PASSWORD" | base64 -w0)" \
            --arg prod "$NEXUS_PROD_REGISTRY" \
            --arg staging "$NEXUS_STAGING_REGISTRY" \
            --arg cache "$NEXUS_CACHE_REGISTRY" \
        '{auths: {($prod): {auth: $auth}, ($staging): {auth: $auth}, ($cache): {auth: $auth}}}' \
        >"${DOCKER_CONFIG}/config.json"

      export IMAGE_TAG="sha-${CI_COMMIT_SHA}"
      export STAGING_IMAGE="${NEXUS_STAGING_REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
      export PROD_SHA_IMAGE="${NEXUS_PROD_REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
      export PROD_CHANNEL_IMAGE="${NEXUS_PROD_REGISTRY}/${IMAGE_REPOSITORY}:${CI_DEFAULT_BRANCH}"
      export CACHE_IMAGE="${NEXUS_CACHE_REGISTRY}/${CACHE_REPOSITORY}:${CI_DEFAULT_BRANCH}"
      export XDG_RUNTIME_DIR="/tmp/buildkit-${CI_PROJECT_ID}-${CI_JOB_ID}"
      install -d -m 0700 "$XDG_RUNTIME_DIR"
      _cleanup_buildkit_runtime() {
        rmdir -- "$XDG_RUNTIME_DIR" 2>/dev/null || true
      }
      # Одна ловушка на всё: второй `trap … EXIT` перезаписывает первый,
      # поэтому очистка docker config живёт здесь же, а не отдельной строкой.
      # `_cleanup_nexus_credentials` убран — он приходил из .ci/load-nexus-
      # credentials.sh, которого больше нет, и джоба падала на выходе с
      # exit 127 УЖЕ ПОСЛЕ успешной публикации образа.
      _cleanup_all() {
        _cleanup_buildkit_runtime
        rm -f -- "${DOCKER_CONFIG}/config.json"
      }
      trap _cleanup_all EXIT
      export BUILDKIT_ROOT="/var/lib/gitlab-runner/buildkit/project-${CI_PROJECT_ID}"
      export BUILDKITD_FLAGS="--config /etc/buildkit/buildkitd.toml --oci-worker-no-process-sandbox --oci-worker-snapshotter=overlayfs --root ${BUILDKIT_ROOT}"

      /usr/local/bin/buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt platform=linux/amd64 \
        --opt "build-arg:VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME}" \
        --opt "build-arg:GIT_SHA=${CI_COMMIT_SHA}" \
        --import-cache "type=registry,ref=${CACHE_IMAGE}" \
        --export-cache "type=registry,ref=${CACHE_IMAGE},mode=max,image-manifest=true,oci-mediatypes=true" \
        --output "type=image,name=${STAGING_IMAGE},push=true" \
        --metadata-file build-metadata.json

      trivy image \
        --cache-dir "$TRIVY_CACHE_DIR" \
        --format cyclonedx \
        --output sbom.cdx.json \
        "$STAGING_IMAGE"

      trivy image \
        --cache-dir "$TRIVY_CACHE_DIR" \
        --severity CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        "$STAGING_IMAGE"

      staging_digest="$(crane digest "$STAGING_IMAGE")"
      if existing_digest="$(crane digest "$PROD_SHA_IMAGE" 2>/dev/null)"; then
        if [[ "$existing_digest" != "$staging_digest" ]]; then
          echo "immutable tag ${PROD_SHA_IMAGE} already points to another digest" >&2
          exit 1
        fi
      else
        crane copy "$STAGING_IMAGE" "$PROD_SHA_IMAGE"
      fi

      prod_digest="$(crane digest "$PROD_SHA_IMAGE")"
      if [[ "$prod_digest" != "$staging_digest" ]]; then
        echo "production digest verification failed" >&2
        exit 1
      fi

      deployed_tag="$IMAGE_TAG"
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        crane copy "$PROD_SHA_IMAGE" "$PROD_CHANNEL_IMAGE"
        channel_digest="$(crane digest "$PROD_CHANNEL_IMAGE")"
        if [[ "$channel_digest" != "$prod_digest" ]]; then
          echo "${CI_DEFAULT_BRANCH} channel digest verification failed" >&2
          exit 1
        fi
        deployed_tag="$CI_DEFAULT_BRANCH"
      fi

      {
        printf 'CABINET_IMAGE=%s/%s\n' "$NEXUS_PROD_REGISTRY" "$IMAGE_REPOSITORY"
        printf 'CABINET_IMAGE_TAG=%s\n' "$deployed_tag"
        printf 'CABINET_IMAGE_IMMUTABLE_TAG=%s\n' "$IMAGE_TAG"
        printf 'CABINET_IMAGE_DIGEST=%s\n' "$prod_digest"
      } > image.env
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build-metadata.json
      - sbom.cdx.json
      - image.env
    reports:
      dotenv: image.env

deploy_production:
  stage: deploy
  # Деплой, прерванный на середине новым коммитом, оставляет прод в неизвестном
  # состоянии — это дороже лишней минуты пайплайна.
  interruptible: false
  resource_group: bedolaga-cabinet-deploy
  environment:
    name: production
    url: https://b1.iamem.store
  needs:
    - job: build_scan_publish
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.oh-my-devops.space
  variables:
    VAULT_SERVER_URL: https://vault.lab.oh-my-devops.space
    VAULT_AUTH_PATH: gitlab-jwt
    VAULT_AUTH_ROLE: github-mirror-build
    # Не секрет, поэтому переменной, а не из Vault.
    COOLIFY_BASE_URL: https://coolify.lab.oh-my-devops.space
  secrets:
    COOLIFY_API_TOKEN:
      vault:
        engine: {name: kv-v2, path: secret}
        path: infra/ci/coolify
        field: api_token
      token: $VAULT_ID_TOKEN
      file: false
  script:
    - .ci/deploy-coolify.sh
