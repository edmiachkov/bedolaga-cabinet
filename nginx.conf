server {
    listen 80;
    # Слушаем и IPv6: healthcheck ходит на localhost, который в контейнере
    # резолвится в [::1] — без этой строки wget получает Connection refused
    # и контейнер стабильно уходит в unhealthy (#3024 в репозитории бота).
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API — бэкенд кабинета в боте (сервис `bot` того же compose). Раньше это
    # делал конфиг, примонтированный из /tmp хоста: он пропадал при перезагрузке,
    # и вход в кабинет ломался. Без сервиса `bot` в сети nginx не стартует.
    location /api/ {
        proxy_pass http://bot:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Optional: кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
